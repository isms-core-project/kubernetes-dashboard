# ==============================================================================================================
# 01-secrets.yaml
#
# The CSRF secret is NOT in this file — create it with the command below before applying manifests:
#
#   kubectl -n kubernetes-dashboard create secret generic kubernetes-dashboard-csrf \
#     --from-literal=private.key="$(openssl rand 256 | base64 | tr -d '\n')"
#
# Save the generated key if you want to reuse it on future deploys (avoids invalidating sessions).
#
# Same for the metrics-scraper shared auth token (api <-> metrics-scraper): one Secret, read by
# both the api and metrics-scraper deployments as METRICS_SCRAPER_AUTH_TOKEN. Without it,
# metrics-scraper rejects every request (fails closed, not open) and pod sparklines/graphs go
# blank — create it before applying manifests:
#
#   kubectl -n kubernetes-dashboard create secret generic kubernetes-dashboard-metrics-scraper-auth \
#     --from-literal=token="$(openssl rand -hex 32)"
#
# Save the generated token the same way if you want to reuse it on future deploys.
# ==============================================================================================================
